[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemas"
version = "0.0.1"
description = "Shared pydantic contracts (e.g. the Halt Signal) used across the Agent Execution Guardian packages."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
