[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interceptor"
version = "0.0.1"
description = "Per-node LangGraph instrumentation that captures state snapshots and callback events for the Agent Execution Guardian."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langgraph>=1,<2",
    "langchain-core>=1,<2",
    "schemas",
    "sanitizer",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "jsonschema>=4,<5",
    "queue-client",
    "fakeredis>=2,<3",
    "langchain>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interceptor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
