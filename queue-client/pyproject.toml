[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queue-client"
version = "0.0.1"
description = "Client for publishing/consuming trace events on the evaluation queue (kept separate from checkpointer state)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "redis>=5,<6",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "fakeredis>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/queue_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
